<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trening</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f76707">
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg) fixed;color:var(--text);font-family:var(--font,'Segoe UI',Arial,sans-serif);font-size:17px;transition:background .4s,color .4s}
body.noanim *,body.noanim *::before,body.noanim *::after{animation:none!important;transition:none!important}

/* ===== MOTYWY ===== */
body[data-motyw=firmowy]{--bg:linear-gradient(135deg,#fff4e6,#ffd8a8 55%,#ffb36b);--panel:rgba(255,255,255,.92);--line:#e8772e;--accent:#f76707;--accent2:#ffa94d;--text:#4a2a0c;--muted:#8a5a2b;--btn:linear-gradient(135deg,#ffa94d,#f76707);--btnTxt:#fff;--btnSh:#b44a00;--inBg:#fff;--inTxt:#3b1f05}
body[data-motyw=retro]{--bg:#e9e7e1;--panel:#fbfbf8;--line:#7d7d7d;--accent:#d9621e;--accent2:#c9c9c9;--text:#222;--muted:#666;--btn:linear-gradient(#ffffff,#dedcd6);--btnTxt:#222;--btnSh:#8a8a8a;--inBg:#fff;--inTxt:#111}
body[data-motyw=jasny]{--bg:#f5f5f8;--panel:#fff;--line:#dedee6;--accent:#ff8a3d;--accent2:#ffc27a;--text:#1d1d22;--muted:#6a6a75;--btn:linear-gradient(135deg,#ff9f4a,#ff7a1a);--btnTxt:#fff;--btnSh:#c95a10;--inBg:#fff;--inTxt:#111}
body[data-motyw=ciemny]{--bg:#121216;--panel:#1e1f25;--line:#3a3c46;--accent:#ff9440;--accent2:#ffb36b;--text:#f2f2f5;--muted:#a0a3b1;--btn:linear-gradient(135deg,#ff9440,#e2661a);--btnTxt:#fff;--btnSh:#8c3f0c;--inBg:#2a2c35;--inTxt:#f2f2f5}
body[data-motyw=mono]{--bg:#000;--panel:#111;--line:#fff;--accent:#fff;--accent2:#8a8a8a;--text:#fff;--muted:#bdbdbd;--btn:#fff;--btnTxt:#000;--btnSh:#6b6b6b;--inBg:#1a1a1a;--inTxt:#fff}
body[data-motyw=czerwony]{--bg:linear-gradient(160deg,#fdeeee,#f3c3c3);--panel:rgba(255,255,255,.88);--line:#d86b6b;--accent:#d06060;--accent2:#f2b5b5;--text:#4a1f1f;--muted:#8a5555;--btn:linear-gradient(135deg,#f0a0a0,#e08080);--btnTxt:#3d1212;--btnSh:#a85454;--inBg:#fff;--inTxt:#2a1010}
body[data-motyw=zielony]{--bg:linear-gradient(160deg,#eef8f1,#bfe6cc);--panel:rgba(255,255,255,.88);--line:#6fbf8e;--accent:#4fa371;--accent2:#b8e3c8;--text:#1d3b2a;--muted:#4f7a60;--btn:linear-gradient(135deg,#a8dcb9,#7cc497);--btnTxt:#15301f;--btnSh:#4e8a66;--inBg:#fff;--inTxt:#112a1c}
body[data-motyw=niebieski]{--bg:linear-gradient(160deg,#eef5fc,#bcd8f2);--panel:rgba(255,255,255,.88);--line:#6fa3d6;--accent:#4f86c2;--accent2:#b9d7f2;--text:#1b2f4a;--muted:#4f6b8c;--btn:linear-gradient(135deg,#b4d6f5,#82b4e2);--btnTxt:#10233b;--btnSh:#3f6fa3;--inBg:#fff;--inTxt:#10233b}
body[data-motyw=xp]{--bg:linear-gradient(180deg,#0a246a,#3a6ea5);--panel:#d4d0c8;--line:#0a246a;--accent:#0a246a;--accent2:#3a6ea5;--text:#000;--muted:#444;--btn:linear-gradient(#f4f3ee,#d6d0c5);--btnTxt:#000;--btnSh:#808080;--inBg:#fff;--inTxt:#000}
body[data-motyw=xp] .card{border-radius:6px 6px 2px 2px}
body[data-motyw=xp] .btn{border-radius:3px}
body[data-motyw=retro] .card{border-radius:4px;box-shadow:3px 3px 0 #9a9a9a}
body[data-motyw=retro] .btn{border-radius:3px;box-shadow:2px 2px 0 #8a8a8a}

/* ===== ELEMENTY ===== */
.hidden{display:none!important}
.muted{color:var(--muted);font-size:.93em}
.bad{color:#d62839;font-weight:800}
.ok{color:#15803d;font-weight:800}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.ico{width:26px;height:26px;object-fit:contain;vertical-align:middle}
.ico.big{width:64px;height:64px}
.brand-t{font-size:2.2em;font-weight:900;letter-spacing:.08em;color:var(--accent)}
h1,h2,h3{margin:.2em 0}
h2{font-size:1.7em}

.btn{display:inline-flex;align-items:center;gap:10px;justify-content:center;min-height:60px;padding:14px 26px;font:inherit;font-weight:700;font-size:1.12em;border:2px solid var(--line);border-radius:12px;background:var(--btn);color:var(--btnTxt);cursor:pointer;box-shadow:0 6px 0 var(--btnSh);transition:transform .12s,box-shadow .12s,filter .2s;text-decoration:none}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--btnSh)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--text);box-shadow:none}
.btn.small{min-height:44px;padding:8px 16px;font-size:1em}
.btn.danger{background:linear-gradient(135deg,#e63946,#9d0208);color:#fff;box-shadow:0 6px 0 #5c0007}
.btn.wide{width:100%}
.btn.sel{outline:3px solid var(--accent2);outline-offset:2px}
.btn.kb{min-height:64px;font-size:1.25em;padding:10px}

input,select,textarea{width:100%;font:inherit;padding:14px;border-radius:10px;border:2px solid var(--line);background:var(--inBg);color:var(--inTxt);margin:6px 0 16px;box-sizing:border-box}
input[type=checkbox],input[type=range]{width:auto}
textarea{min-height:260px;font-family:Consolas,'Courier New',monospace;font-size:.95em}
label{font-weight:700;display:block}

.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:26px;margin-bottom:20px;box-shadow:0 10px 30px rgba(0,0,0,.15);animation:up .45s both}
.pop{animation:pop .45s both}
.shake{animation:shake .5s}

.bar{height:22px;border-radius:99px;background:rgba(127,127,127,.2);overflow:hidden;border:1px solid var(--line);margin:10px 0}
.bar>i{display:block;height:100%;width:var(--w,0%);background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .8s cubic-bezier(.2,.8,.2,1);position:relative}
.bar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:sheen 2.2s infinite}

.chip{border:2px solid var(--line);border-radius:99px;padding:8px 16px;font-weight:700;background:rgba(127,127,127,.12)}

/* ===== LOGOWANIE ===== */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:min(92vw,440px);text-align:center}
.logo-big{width:150px;height:150px;object-fit:contain;animation:float 4s ease-in-out infinite}

/* ===== NAGŁÓWEK I MENU ===== */
#app{max-width:1400px;margin:0 auto;padding:22px}
.head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;padding:16px 24px}
.logo-wide{height:60px;max-width:400px;object-fit:contain}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:6px 0 24px}
.nav .btn{min-height:96px;font-size:1.15em;flex-direction:column}

/* ===== KURSY ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.course{cursor:pointer;transition:transform .2s}
.course:hover{transform:translateY(-4px)}
.badge{display:inline-block;font-size:.8em;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--accent2);color:#000;margin-left:6px}
.section-t{margin:28px 0 12px}

/* ===== ZADANIA ===== */
.task{font-size:1.2em;line-height:1.7;white-space:pre-wrap;padding:22px;border-radius:12px;background:rgba(127,127,127,.1);border:1px dashed var(--line)}
.hint{background:rgba(255,200,60,.22);border-left:8px solid #f5b800;padding:14px 18px;border-radius:10px;margin-top:14px;white-space:pre-wrap;line-height:1.6}
.expl{background:rgba(76,160,240,.15);border-left:8px solid var(--accent2);padding:16px 18px;border-radius:10px;margin-top:14px;white-space:pre-wrap;line-height:1.6}
.result{margin-top:14px;font-size:1.15em}
.result .row{margin-top:10px}

/* ===== KALENDARZ ===== */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal .hd{text-align:center;font-weight:700;color:var(--muted);padding:6px}
.day{min-height:72px;border:2px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;background:rgba(127,127,127,.08);position:relative;font-weight:700}
.day.empty{border:none;background:none;cursor:default}
.day.today{outline:3px solid var(--accent2)}
.day.sel{background:var(--accent);color:#fff}
.dot{position:absolute;bottom:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--accent2)}
.ev{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px;border-radius:12px;border:2px solid var(--line);margin-bottom:10px;flex-wrap:wrap}

/* ===== STATYSTYKI ===== */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.stat{text-align:center;padding:18px}
.stat b{display:block;font-size:2em;color:var(--accent)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.charts{grid-template-columns:1fr}}
.chart{width:100%;height:auto}
.donut{width:220px;height:220px;display:block;margin:auto}
.grid-line{stroke:var(--muted);stroke-opacity:.3}
.bar-svg{fill:var(--accent)}
.lbl{font-size:11px;fill:var(--text);text-anchor:middle}
.linia{fill:none;stroke:var(--accent);stroke-width:3}
.kropka{fill:var(--accent2)}
.ring-bg{fill:none;stroke:var(--muted);stroke-opacity:.25;stroke-width:22}
.ring{fill:none;stroke:var(--accent);stroke-width:22;stroke-linecap:round;transform:rotate(-90deg);transform-origin:100px 100px;transition:stroke-dasharray 1s}
.big-txt{font-size:30px;font-weight:700;text-anchor:middle;fill:var(--text)}
.hrow{display:flex;align-items:center;gap:12px;margin:10px 0}
.hrow span:first-child{width:200px;flex-shrink:0}
.hrow .bar{flex:1;margin:0}

/* ===== OSIĄGNIĘCIA ===== */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.ach{padding:20px}
.ach.locked{opacity:.45;filter:grayscale(.7)}
.stars{color:#f5b800;letter-spacing:2px;font-size:1.15em}
.ach-pop{position:fixed;top:24px;right:24px;z-index:1000;min-width:280px;max-width:90vw;background:var(--panel);border:2px solid var(--accent);border-radius:14px;padding:14px 18px;box-shadow:0 12px 34px rgba(0,0,0,.3);animation:pop .4s both;color:var(--text)}
.ach-pop.out{opacity:0;transition:opacity .4s}

/* ===== KALKULATOR ===== */
.calc-disp{font-size:1.6em;font-family:Consolas,'Courier New',monospace;text-align:right}
.calc-out{min-height:60px;font-size:1.4em;padding:12px 4px;text-align:right}
.calc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-top:14px}
.calc-eq{width:100%;margin-top:12px}
.kalk-wrap{margin-top:16px;padding:16px;border:2px dashed var(--line);border-radius:14px}

/* ===== USTAWIENIA ===== */
.motyw-btns{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.swatch{display:inline-block;width:26px;height:26px;border-radius:6px;border:2px solid #666;vertical-align:middle;margin-right:8px}
.prompt-box{min-height:340px;font-size:.95em}

/* ===== EFEKTY ===== */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--btn);color:var(--btnTxt);padding:14px 26px;border-radius:99px;font-weight:700;z-index:999;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:pop .35s;border:2px solid var(--line)}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:998;animation:fall linear forwards;border-radius:2px}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes float{50%{transform:translateY(-10px)}}
</style>
</head>
<body data-motyw="firmowy">

<div id="login">
  <div class="card login-card">
    <img src="logo.png" class="logo-big" alt="" onerror="this.style.display='none'">
    <h1 class="brand-t">TRENING</h1>
    <p class="muted">Wpisz hasło, aby wejść</p>
    <input type="password" id="pass" placeholder="Hasło" onkeydown="if(event.key==='Enter')zaloguj()">
    <button class="btn wide" onclick="zaloguj()"><img class="ico" src="check.png" alt="" onerror="this.style.display='none'">Wejdź</button>
    <p id="passErr" class="bad hidden">Nieprawidłowe hasło</p>
  </div>
</div>

<div id="app" class="hidden">
  <header class="card head">
    <div class="row">
      <button id="backBtn" class="btn small ghost hidden" onclick="wstecz()">← Wróć</button>
      <button id="homeBtn" class="btn small ghost hidden" onclick="start()">Start</button>
      <img src="logo-wide.png" class="logo-wide" alt="Logo" onerror="this.outerHTML='<span class=brand-t>TRENING</span>'">
    </div>
    <div class="chips">
      <span class="chip">Punkty: <b id="ptsChip">0</b></span>
      <span class="chip">Seria: <b id="streakChip">0</b></span>
      <span class="chip">Rekord: <b id="recChip">0</b></span>
    </div>
  </header>
  <main id="view"></main>
</div>

<script>
// ===================== KONFIGURACJA =====================
const KLUCZ = "trening_v3";
const HASLO = "matura2026";       // <-- zmień na własne
const IKONA_EXT = "png";

const PRZEDMIOTY = {
  "Matematyka": ["Funkcje","Równania","Geometria","Ciągi","Prawdopodobieństwo","Trygonometria","Pochodna","Ułamki"],
  "Język angielski": ["Słownictwo","Gramatyka","Czytanie","Pisanie","Słuchanie"],
  "Język polski": ["Lektury","Wypracowanie","Gramatyka","Interpretacja tekstu","Środki stylistyczne"],
  "Informatyka": ["Algorytmy","Python","Bazy danych","Systemy operacyjne","Sieci komputerowe","HTML i CSS"]
};
const PRZ_IKONA = {"Matematyka":"math","Język angielski":"english","Język polski":"polish","Informatyka":"it"};

const MOTYWY = [
  ["firmowy","Firmowy pomarańcz","linear-gradient(135deg,#ffa94d,#f76707)"],
  ["retro","Retro biały","linear-gradient(#ffffff,#d9d9d9)"],
  ["jasny","Jasny","linear-gradient(#ffffff,#eceef2)"],
  ["ciemny","Ciemny","linear-gradient(#2a2c35,#121216)"],
  ["mono","Czarno-biały","linear-gradient(#000000,#ffffff)"],
  ["czerwony","Czerwony pastelowy","linear-gradient(#e88a8a,#cf6666)"],
  ["zielony","Zielony pastelowy","linear-gradient(#8fd0a8,#5fb082)"],
  ["niebieski","Niebieski pastelowy","linear-gradient(#a8cdf0,#6fa3d6)"],
  ["xp","Retro XP (granat i szary)","linear-gradient(#0a246a,#d4d0c8)"]
];
const CZCIONKI = {
  "Segoe UI": "'Segoe UI',Arial,sans-serif",
  "Tahoma": "Tahoma,Geneva,sans-serif",
  "Verdana": "Verdana,Geneva,sans-serif",
  "Trebuchet MS": "'Trebuchet MS',Arial,sans-serif",
  "Georgia": "Georgia,serif",
  "Courier New": "'Courier New',monospace"
};
const MIESIACE = ["Styczeń","Luty","Marzec","Kwiecień","Maj","Czerwiec","Lipiec","Sierpień","Wrzesień","Październik","Listopad","Grudzień"];

// ===================== ZADANIA SYSTEMOWE (do ćwiczenia) =====================
// odpowiedz: kilka dopuszczalnych form oddzielaj znakiem |
const SYSTEM = [
  {id:"sys-mat", przedmiot:"Matematyka", temat:"Memy i liczby", sys:true, zadania:[
    {tresc:"Papież 2137 ma w lodówce 24 kremówki i zjada 3 dziennie. Po ilu dniach zostaną mu dokładnie 3 kremówki?",
     odpowiedz:"7", podpowiedz:"Ile kremówek zostanie po 7 dniach?",
     wyjasnienie:"24 − 3 × 7 = 24 − 21 = 3. Po 7 dniach zostają 3 kremówki."},
    {tresc:"Kebab kosztuje 25 zł. Dzielicie rachunek równo między 5 osób. Ile zł płaci każda z nich?",
     odpowiedz:"5", podpowiedz:"Podziel 25 przez 5.",
     wyjasnienie:"25 : 5 = 5. Każda osoba płaci 5 zł, a kebab nadal jest legendarny."},
    {tresc:"Ceny paliw wzrosły z 6,00 zł do 7,20 zł za litr. O ile procent wzrosły? Wpisz samą liczbę.",
     odpowiedz:"20", podpowiedz:"Oblicz różnicę, a potem podziel ją przez starą cenę.",
     wyjasnienie:"Wzrost to 1,20 zł. 1,20 : 6,00 = 0,2 = 20%."},
    {tresc:"Dorota Wellman wypija 3 kawy dziennie. Ile kaw wypije w ciągu tygodnia (7 dni)?",
     odpowiedz:"21", podpowiedz:"Pomnóż 3 przez 7.",
     wyjasnienie:"3 × 7 = 21. Dorota przy takim tempie ma energię na cały program."},
    {tresc:"Blok ma 4 klatki, a w każdej klatce 9 mieszkań. Ile mieszkań ma ten blok?",
     odpowiedz:"36", podpowiedz:"Najpierw policz mieszkania w jednej klatce.",
     wyjasnienie:"4 × 9 = 36 mieszkań. Blok ekipa, pełne obłożenie."},
    {tresc:"Kebab za 25 zł i napój za 7 zł. Ile płacisz za zestaw?",
     odpowiedz:"32", podpowiedz:"Dodaj obie ceny.",
     wyjasnienie:"25 + 7 = 32 zł."},
    {tresc:"Ile wynosi 2/3 + 1/6? Wpisz wynik jako ułamek zwykły.",
     odpowiedz:"5/6", podpowiedz:"Sprowadź oba ułamki do mianownika 6.",
     wyjasnienie:"2/3 = 4/6, więc 4/6 + 1/6 = 5/6."},
    {tresc:"Ile wynosi 3/4 z 200?",
     odpowiedz:"150", podpowiedz:"Podziel 200 przez 4, a potem pomnóż przez 3.",
     wyjasnienie:"200 : 4 = 50, 50 × 3 = 150."},
    {tresc:"Rizz na poziomie 7 na 10. Ile to procent?",
     odpowiedz:"70", podpowiedz:"7 z 10 to 7/10.",
     wyjasnienie:"7/10 = 0,7 = 70%. Rizz na poziomie wyższym niż Twój, bez cienia wątpliwości."}
  ]},
  {id:"sys-ang", przedmiot:"Język angielski", temat:"Slang i memy", sys:true, zadania:[
    {tresc:"Co oznacza slang „rizz”?\nA) zmęczenie\nB) umiejętność podrywu\nC) rodzaj samochodu\nWpisz literę.",
     odpowiedz:"B", podpowiedz:"Pomyśl o uroku osobistym i tym, jak ktoś zagaduje.",
     wyjasnienie:"Rizz to slangowe określenie zdolności do podrywania ludzi i budowania sympatii."},
    {tresc:"Uzupełnij jednym słowem: The release of GTA VI has been ______ again.",
     odpowiedz:"delayed", podpowiedz:"Przesunięta na późniejszy termin (strona bierna).",
     wyjasnienie:"Has been delayed, czyli zostało przesunięte. Czasownik delay w stronie biernej: be delayed."},
    {tresc:"Dorota Wellman often ______ guests on TV. Wpisz jedno słowo: czasownik oznaczający przeprowadzanie wywiadu.",
     odpowiedz:"interview", podpowiedz:"Rzeczownik to „interview”, a czasownik jest taki sam.",
     wyjasnienie:"To interview (przeprowadzić wywiad). Dorota often interviews guests, czyli zaprasza gości i z nimi rozmawia."},
    {tresc:"Co znaczy slang „no cap”?\nA) bez kłamstwa, serio\nB) bez czapki\nC) bez pieniędzy\nWpisz literę.",
     odpowiedz:"A", podpowiedz:"Cap oznacza kłamstwo.",
     wyjasnienie:"No cap = mówię serio, bez kłamstwa. Cap to w slangu właśnie kłamstwo."},
    {tresc:"Co znaczy slang „bussin” o jedzeniu?\nA) nudne\nB) bardzo dobre\nC) zepsute\nWpisz literę.",
     odpowiedz:"B", podpowiedz:"Mówi się tak o kebabie, który jest naprawdę dobry.",
     wyjasnienie:"Bussin to bardzo dobre, pyszne. Słowo pochodzi z mowy młodzieżowej, a nie z podręcznika."},
    {tresc:"Co znaczy „lowkey”?\nA) całkowicie\nB) trochę, po cichu\nC) głośno\nWpisz literę.",

function domyslne(){
  return {
    ustawienia: {motyw:"firmowy", czcionka:"Segoe UI", rozmiar:17, anim:true, kalk:false, kalkTryb:"prosty", mieszane:false},
    kursy: [], historia: [], wydarzenia: [],
    punkty: 0, seria: 0, maxSeria: 0, sysOk: {},
    stat: {poprawne:0, bezPodp:0, wyjas:0, kalk:0, ponow:0, dodane:0},
    osiagniete: {}
  };
}
function wczytaj(){
  const d = domyslne();
  try {
    const s = JSON.parse(localStorage.getItem(KLUCZ) || "null");
    if (s){
      const u = {...d.ustawienia, ...(s.ustawienia || {})};
      if (!MOTYWY.some(m => m[0] === u.motyw)) u.motyw = "firmowy";
      return {...d, ...s, ustawienia: u, stat: {...d.stat, ...(s.stat || {})}, osiagniete: s.osiagniete || {}};
    }
  } catch(e){}
  return d;
}
let dane = wczytaj();
let odpowiedziono = false, uzytaPodpowiedz = false, wyjOtwarte = false, aktualne = {id:null, i:0};

// ===================== POMOCNICZE =====================
const $ = id => document.getElementById(id);
function zapisz(){
  sprawdzOsiagniecia();
  localStorage.setItem(KLUCZ, JSON.stringify(dane));
  odswiezPasek();
}
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function ikona(n, cls=""){ return `<img class="ico ${cls}" src="${n}.${IKONA_EXT}" alt="" onerror="this.style.display='none'">`; }
function V(h){ $("view").innerHTML = h; }
function pad(n){ return String(n).padStart(2,"0"); }
function klucz(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function kurs(id){ return SYSTEM.find(x => x.id === id) || dane.kursy.find(k => k.id === id); }
function nazwaKursu(id){ const k = kurs(id); return k ? `${k.przedmiot} · ${k.temat}` : "(usunięty kurs)"; }
function czyOk(k){ return k.sys ? (dane.sysOk[k.id] || []) : (k.ok || []); }
function dodajOk(k, i){
  if (k.sys){ dane.sysOk[k.id] = dane.sysOk[k.id] || []; if (!dane.sysOk[k.id].includes(i)) dane.sysOk[k.id].push(i); }
  else { k.ok = k.ok || []; if (!k.ok.includes(i)) k.ok.push(i); }
}
function proc(k){ return k.zadania.length ? Math.round(czyOk(k).length / k.zadania.length * 100) : 0; }
function toast(t){
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = t;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}
function konfetti(){
  if (!dane.ustawienia.anim) return;
  const kolory = ["#ffa94d","#f76707","#ffd8a8","#ffffff","#8a5a2b"];
  for (let i = 0; i < 90; i++){
    const c = document.createElement("div");
    c.className = "conf";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = kolory[i % kolory.length];
    c.style.animationDuration = (2 + Math.random() * 2) + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4500);
  }
}
function odswiezPasek(){
  $("ptsChip").textContent = dane.punkty;
  $("streakChip").textContent = dane.seria;
  $("recChip").textContent = dane.maxSeria;
}
function applyUstawienia(){
  const u = dane.ustawienia;
  document.body.dataset.motyw = u.motyw;
  document.body.style.fontFamily = CZCIONKI[u.czcionka] || CZCIONKI["Segoe UI"];
  document.body.style.fontSize = u.rozmiar + "px";
  document.body.classList.toggle("noanim", !u.anim);
}

// ===================== OSIĄGNIĘCIA: LOGIKA =====================
function sysDone(id){
  const k = SYSTEM.find(x => x.id === id);
  return !!k && (dane.sysOk[id] || []).length === k.zadania.length;
}
function statystyki(){
  return {
    kursy: dane.kursy.length,
    poprawne: dane.stat.poprawne,
    seria: dane.maxSeria,
    bezPodp: dane.stat.bezPodp,
    wyjas: dane.stat.wyjas,
    kalk: dane.stat.kalk,
    ponow: dane.stat.ponow,
    dodane: dane.stat.dodane,
    wydarzenia: dane.wydarzenia.length,
    pelnyKurs: dane.kursy.some(k => k.zadania.length && czyOk(k).length === k.zadania.length),
    sysDone
  };
}
function sprawdzOsiagniecia(){
  const s = statystyki();
  OSIAGNIECIA.forEach(a => {
    if (!dane.osiagniete[a.id] && a.warunek(s)){
      dane.osiagniete[a.id] = new Date().toLocaleDateString("pl-PL");
      kolejkaOsiagniec.push(a);
    }
  });
  if (kolejkaOsiagniec.length && !pokazujeSie) pokazNastepne();
}
function pokazNastepne(){
  if (!kolejkaOsiagniec.length){ pokazujeSie = false; return; }
  pokazujeSie = true;
  const a = kolejkaOsiagniec.shift();
  const el = document.createElement("div");
  el.className = "ach-pop";
  el.innerHTML = `<b>Osiągnięcie odblokowane!</b>
    <div style="font-size:1.15em;margin:4px 0">${esc(a.nazwa)} <span class="stars">${gwiazdki(a.stars)}</span></div>
    <div class="muted">${esc(a.opis)}</div>`;
  document.body.appendChild(el);
  if (dane.ustawienia.anim) konfetti();
  setTimeout(() => {
    el.classList.add("out");
    setTimeout(() => { el.remove(); pokazNastepne(); }, 400);
  }, 3400);
}

function przejdz(w, a, b){ biezacy = {w, a, b}; pokaz(); }
function wstecz(){ biezacy = stos.pop() || {w:"kursy", a:null, b:null}; pokaz(); }
function start(){ stos = []; biezacy = {w:"kursy", a:null, b:null}; pokaz(); }

// ===================== KURSY =====================
function navHTML(){
  const pozycje = [
    ["kalendarz","Kalendarz","calendar"], ["statystyki","Statystyki","stats"],
    ["osiagniecia","Osiągnięcia","stats"], ["historia","Historia","history"], ["help","Help","help"]
  ];
  if (dane.ustawienia.kalk) pozycje.push(["kalkulator","Kalkulator","calc"]);
  pozycje.push(["ustawienia","Ustawienia","settings"]);
  return `<nav class="nav">${pozycje.map(([w,t,ic]) =>
    `<button class="btn" onclick="go('${w}')">${ikona(ic)}${t}</button>`).join("")}</nav>`;
}
function kartaKursu(k, systemowy){
  const p = proc(k);
  return `<div class="card course" onclick="go('kurs','${k.id}')">
    <div class="row">
      ${ikona(PRZ_IKONA[k.przedmiot], "big")}
      <div><h3>${esc(k.temat)}${systemowy ? '<span class="badge">systemowe</span>' : ''}</h3>
      <div class="muted">${esc(k.przedmiot)} · zadań: ${k.zadania.length}</div></div>
    </div>
    <div class="bar" style="--w:${p}%"><i></i></div>
    <div class="muted">Postęp: ${p}%</div>
  </div>`;
}
function renderKursy(){
  let h = navHTML();
  h += `<div class="row between"><h2>Moje kursy</h2>
    <button class="btn" onclick="go('nowy')">${ikona("add")}Nowy kurs</button></div>`;
  if (!dane.kursy.length) h += `<div class="card"><p>Nie masz jeszcze kursów. Dodaj pierwszy, np. z matematyki.</p></div>`;
  h += `<div class="grid">${dane.kursy.map(k => kartaKursu(k, false)).join("")}</div>`;
  h += `<h2 class="section-t">Zadania systemowe do ćwiczeń</h2><div class="grid">${SYSTEM.map(k => kartaKursu(k, true)).join("")}</div>`;
  V(h);
}
function renderNowy(){
  const opcje = Object.keys(PRZEDMIOTY).map(p => `<option>${esc(p)}</option>`).join("");
  V(`<div class="card pop"><h2>Nowy kurs</h2>
    <label>Przedmiot</label>
    <select id="przedm" onchange="odswiezTematy()">${opcje}</select>
    <label>Zagadnienie (wybierz z listy lub wpisz własne)</label>
    <input id="temat" list="tematy" placeholder="np. Pochodna">
    <datalist id="tematy"></datalist>
    <div class="row">
      <button class="btn" onclick="zapiszKurs()">Utwórz</button>
      <button class="btn ghost" onclick="wstecz()">Anuluj</button>
    </div></div>`);
  odswiezTematy();
}
function odswiezTematy(){
  const p = $("przedm").value;
  $("tematy").innerHTML = PRZEDMIOTY[p].map(t => `<option value="${esc(t)}">`).join("");
}
function zapiszKurs(){
  const p = $("przedm").value, t = $("temat").value.trim();
  if (!t) return toast("Wpisz zagadnienie");
  dane.kursy.push({id: Date.now().toString(), przedmiot: p, temat: t, zadania: [], ok: []});
  zapisz();
  toast("Kurs utworzony");
  start();
}
function renderKurs(id){
  const k = kurs(id);
  if (!k) return start();
  const p = proc(k);
  V(`<div class="card pop">
    <div class="row">${ikona(PRZ_IKONA[k.przedmiot], "big")}
      <div><h2>${esc(k.temat)}</h2><div class="muted">${esc(k.przedmiot)}</div></div></div>
    <div class="bar" style="--w:${p}%"><i></i></div>
    <p class="muted">Opanowane zadania: ${czyOk(k).length} z ${k.zadania.length} (${p}%)</p>
    <div class="row" style="margin-top:18px">
      <button class="btn" ${k.zadania.length ? "" : "disabled"} onclick="go('rozwiazuj','${id}',0)">${ikona("explain")}Rozwiązuj zadania</button>
      ${k.sys ? "" : `<button class="btn" onclick="go('dodaj','${id}')">${ikona("add")}Dodaj treść</button>`}
      ${k.sys ? "" : `<button class="btn small danger" onclick="usunKurs('${id}')">${ikona("delete")}Usuń kurs</button>`}
    </div></div>`);
}
function usunKurs(id){
  if (!confirm("Na pewno usunąć ten kurs?")) return;
  dane.kursy = dane.kursy.filter(k => k.id !== id);
  dane.wydarzenia = dane.wydarzenia.map(w => w.kursId === id ? {...w, kursId: ""} : w);
  zapisz();
  start();
}

const PRZYKLAD = `[
  {"tresc": "Oblicz f(4), jeśli f(x) = 2x + 3.", "odpowiedz": "11",
   "podpowiedz": "Podstaw 4 zamiast x.", "wyjasnienie": "f(4) = 2 · 4 + 3 = 11"},
  {"tresc": "Ile wynosi 2 + 3 · 4 ?", "odpowiedz": "14|14,0",
   "wyjasnienie": "Najpierw mnożenie: 3 · 4 = 12, potem 2 + 12 = 14"}
]`;
function renderDodaj(id){
  V(`<div class="card pop"><h2>Dodaj treść</h2>
    <p class="muted">Wklej zadania w formacie JSON. Pola <b>tresc</b> i <b>odpowiedz</b> są wymagane, <b>podpowiedz</b> i <b>wyjasnienie</b> opcjonalne. Kilka dopuszczalnych odpowiedzi oddziel znakiem |. Gotowy prompt do AI znajdziesz w Help.</p>
    <textarea id="json">${esc(PRZYKLAD)}</textarea>
    <div class="row">
      <button class="btn" onclick="zapiszZadania('${id}')">Zapisz zadania</button>
      <button class="btn ghost" onclick="wstecz()">Wstecz</button>
    </div></div>`);
}
function zapiszZadania(id){
  const k = kurs(id);
  let nowe;
  try { nowe = JSON.parse($("json").value); }
  catch(e){ return alert("Błąd w formacie JSON:\n" + e.message); }
  if (!Array.isArray(nowe)) return alert("Treść musi być tablicą i zaczynać się od [");
  const zle = nowe.findIndex(z => !z.tresc || z.odpowiedz === undefined);
  if (zle >= 0) return alert(`Zadanie nr ${zle + 1} nie ma pola "tresc" albo "odpowiedz"`);
  k.zadania.push(...nowe.map(z => ({
    tresc: z.tresc, odpowiedz: String(z.odpowiedz),

  })));

  konfetti();
  toast(`Dodano ${nowe.length} zadań`);

}

// ===================== ROZWIĄZYWANIE =====================
function renderRozwiazuj(id, i){
  const k = kurs(id);
  if (!k || !k.zadania.length) return przejdz("kurs", id);
  if (i >= k.zadania.length){
    const p = proc(k);
    V(`<div class="card pop" style="text-align:center">
      <h2>Koniec kursu</h2>
      <p>Opanowałeś <b>${czyOk(k).length}</b> z <b>${k.zadania.length}</b> zadań (${p}%).</p>
      <div class="bar" style="--w:${p}%"><i></i></div>
      <div class="row" style="justify-content:center;margin-top:16px">
        <button class="btn" onclick="przejdz('rozwiazuj','${id}',0)">Od początku</button>
        <button class="btn ghost" onclick="wstecz()">Wróć do kursu</button>
      </div></div>`);
    konfetti();
    return;
  }
  odpowiedziono = false; uzytaPodpowiedz = false; wyjOtwarte = false;
  aktualne = {id, i};
  const p = Math.round(i / k.zadania.length * 100);
  V(`<div class="card pop" id="karta">
    <div class="row between">
      <span class="muted">${esc(k.przedmiot)} · ${esc(k.temat)}</span>
      <span class="chip">Zadanie ${i + 1} / ${k.zadania.length}</span>
    </div>
    <div class="bar" style="--w:${p}%"><i></i></div>
    <div class="task">${esc(k.zadania[i].tresc)}</div>
    <input id="odp" placeholder="Twoja odpowiedź (Enter = sprawdź, drugi Enter = dalej)" autocomplete="off"
      onkeydown="klawisz(event,'${id}',${i})">
    <div class="row">
      <button class="btn" id="btnOdp" onclick="sprawdzOdp('${id}',${i})">Odpowiedz</button>
      <button class="btn" style="background:linear-gradient(135deg,#ffd166,#f4a261);color:#3b1f05" onclick="pokazPodpowiedz()">${ikona("hint")}Podpowiedź (−5 pkt)</button>
      <button class="btn" onclick="pokazWyjasnienie()">${ikona("explain")}Wyjaśnienie</button>
      <button class="btn ghost" onclick="przejdz('rozwiazuj','${id}',${i + 1})">${ikona("next")}Następne</button>
      ${dane.ustawienia.kalk ? `<button class="btn" onclick="pokazKalk()">Kalkulator</button>` : ""}
    </div>
    ${dane.ustawienia.kalk ? `<div id="kalkBox" class="kalk-wrap hidden">${kalkPanel()}</div>` : ""}
    <div id="podp"></div>
    <div id="wynik" class="result"></div>
    <div id="wyj"></div>
  </div>`);
  setTimeout(() => { const el = $("odp"); if (el) el.focus(); }, 50);
}
function klawisz(e, id, i){
  if (e.key !== "Enter") return;
  if (odpowiedziono) przejdz("rozwiazuj", id, i + 1);
  else sprawdzOdp(id, i);
}
function pokazKalk(){
  const el = $("kalkBox");
  el.classList.toggle("hidden");
  if (!el.classList.contains("hidden")){ dane.stat.kalk++; zapisz(); }
}
function pokazPodpowiedz(){
  const k = kurs(aktualne.id), z = k && k.zadania[aktualne.i];
  if (!z) return;
  if (!z.podpowiedz) return toast("Brak podpowiedzi do tego zadania");
  uzytaPodpowiedz = true;
  $("podp").innerHTML = `<div class="hint pop">${esc(z.podpowiedz)}</div>`;
}
function pokazWyjasnienie(){
  const k = kurs(aktualne.id), z = k && k.zadania[aktualne.i];
  if (!z) return;
  if (!wyjOtwarte){ wyjOtwarte = true; dane.stat.wyjas++; zapisz(); }
  $("wyj").innerHTML = `<div class="expl pop">${esc(z.wyjasnienie || "Brak wyjaśnienia.")}</div>`;
}
function sprawdzOdp(id, i){
  if (odpowiedziono) return;
  const k = kurs(id), z = k.zadania[i];
  const podana = $("odp").value.trim();
  if (!podana) return toast("Wpisz odpowiedź");
  odpowiedziono = true;
  const dozwolone = String(z.odpowiedz).split("|").map(s => s.trim().toLowerCase());
  const dobra = dozwolone.includes(podana.toLowerCase());
  const bylo = czyOk(k).includes(i);
  const pkt = (dobra && !bylo) ? (uzytaPodpowiedz ? 5 : 10) : 0;

  if (dobra){
    dane.punkty += pkt;
    dane.seria += 1;
    dane.maxSeria = Math.max(dane.maxSeria, dane.seria);
    dane.stat.poprawne += 1;
    if (!uzytaPodpowiedz) dane.stat.bezPodp += 1;
    dodajOk(k, i);
  } else {
    dane.seria = 0;
  }
  const now = new Date();
  dane.historia.unshift({
    ts: now.getTime(), dzien: klucz(now), data: now.toLocaleString("pl-PL"),
    przedmiot: k.przedmiot, kurs: k.temat, zadanie: i + 1,
    podana, poprawna: dozwolone[0], dobra, pkt
  });
  dane.historia = dane.historia.slice(0, 1000);
  zapisz();

  $("odp").disabled = true;
  $("btnOdp").disabled = true;
  let html;
  if (dobra){
    html = `<span class="ok">Dobrze! ${pkt ? "+" + pkt + " pkt" : "Zadanie było już zaliczone, bez punktów."}</span>`;
    konfetti();
  } else {
    html = `<span class="bad">Nie tym razem.</span> Poprawna odpowiedź: <b>${esc(dozwolone[0])}</b>
      <div class="row"><button class="btn small" onclick="ponow('${id}',${i})">Spróbuj ponownie</button></div>`;
    const karta = $("karta");
    karta.classList.add("shake"); setTimeout(() => karta.classList.remove("shake"), 500);
  }
  $("wynik").innerHTML = html;
}
function ponow(id, i){
  dane.stat.ponow += 1;
  zapisz();
  przejdz("rozwiazuj", id, i);
}

function zmienMiesiac(d){
  cal.m += d;
  if (cal.m < 0){ cal.m = 11; cal.y--; }
  if (cal.m > 11){ cal.m = 0; cal.y++; }
  renderKalendarz();
}
function dzisiaj(){
  const t = new Date();
  cal = {y: t.getFullYear(), m: t.getMonth(), sel: klucz(t)};

}
function wybierzDzien(k){ cal.sel = k; renderKalendarz(); }
function renderKalendarz(){
  if (!cal.sel) cal.sel = klucz(new Date());
  const pierwszy = new Date(cal.y, cal.m, 1);
  const przesun = (pierwszy.getDay() + 6) % 7;
  const ile = new Date(cal.y, cal.m + 1, 0).getDate();
  const dzisK = klucz(new Date());
  let siatka = ["Pn","Wt","Śr","Cz","Pt","So","Nd"].map(d => `<div class="hd">${d}</div>`).join("");

  for (let d = 1; d <= ile; d++){

    const ma = dane.wydarzenia.some(w => w.data === k);
    siatka += `<div class="day ${k === dzisK ? "today" : ""} ${k === cal.sel ? "sel" : ""}" onclick="wybierzDzien('${k}')">${d}${ma ? '<span class="dot"></span>' : ""}</div>`;
  }
  const prefix = `${cal.y}-${pad(cal.m + 1)}`;
  const listaMies = dane.wydarzenia.filter(w => w.data.startsWith(prefix)).sort((a, b) => a.data.localeCompare(b.data));
  const listaHtml = listaMies.length ? listaMies.map(w => `

      <div><b>${esc(w.data)}${w.godz ? " · " + esc(w.godz) : ""}</b> · ${esc(w.kat)}<br>${esc(w.tytul)}

  const kursyOpcje = `<option value="">— brak —</option>` +
    [...SYSTEM, ...dane.kursy].map(k => `<option value="${k.id}">${esc(k.przedmiot)} · ${esc(k.temat)}</option>`).join("");

  V(navHTML() + `
    <div class="row between" style="margin-bottom:18px">
      <h2>${MIESIACE[cal.m]} ${cal.y}</h2>
      <div class="row">
        <button class="btn small" onclick="zmienMiesiac(-1)">◀</button>
        <button class="btn small" onclick="dzisiaj()">Dziś</button>
        <button class="btn small" onclick="zmienMiesiac(1)">▶</button>
      </div></div>
    <div class="card"><div class="cal">${siatka}</div></div>
    <div class="card pop"><h3>Nowe wydarzenie</h3>
      <div class="row" style="align-items:flex-end">
        <div style="flex:2;min-width:220px"><label>Tytuł</label><input id="w_tytul" placeholder="np. Kurs na prawo jazdy, sesja, termin"></div>
        <div style="flex:1;min-width:160px"><label>Data</label><input type="date" id="w_data" value="${cal.sel}"></div>
        <div style="flex:1;min-width:120px"><label>Godzina</label><input type="time" id="w_godz"></div>
      </div>
      <div class="row" style="align-items:flex-end">
        <div style="flex:1;min-width:200px"><label>Kategoria</label>

        <div style="flex:2;min-width:240px"><label>Powiąż z kursem (opcjonalnie)</label>
          <select id="w_kurs">${kursyOpcje}</select></div>

}
function dodajWydarzenie(){
  const tytul = $("w_tytul").value.trim();
  const data = $("w_data").value;
  if (!tytul) return toast("Wpisz tytuł wydarzenia");
  if (!data) return toast("Wybierz datę");
  dane.wydarzenia.push({id: Date.now().toString(), data, godz: $("w_godz").value, tytul, kat: $("w_kat").value, kursId: $("w_kurs").value});
  zapisz();

// ===================== STATYSTYKI =====================
function wykresSlupkowy(etykiety, wartosci){
  const W = 640, H = 240, P = 34;
  const max = Math.max(1, ...wartosci);
  const n = wartosci.length, szer = (W - 2 * P) / n;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart">`;
  for (let g = 0; g <= 4; g++){
    const y = P / 2 + (H - P - P / 2) * g / 4;
    s += `<line x1="${P}" x2="${W - P / 2}" y1="${y}" y2="${y}" class="grid-line"/>`;
  }
  wartosci.forEach((v, i) => {
    const h = (H - P - P / 2) * v / max;
    const x = P + i * szer + szer * 0.15, y = H - P - h;
    s += `<rect x="${x}" y="${y}" width="${szer * 0.7}" height="${h}" rx="4" class="bar-svg"><title>${etykiety[i]}: ${v}</title></rect>`;
    s += `<text x="${x + szer * 0.35}" y="${H - P + 14}" class="lbl">${etykiety[i]}</text>`;
  });
  return s + `</svg>`;
}
function wykresKolowy(dobre, zle){
  const suma = dobre + zle, frac = suma ? dobre / suma : 0, r = 70, C = 2 * Math.PI * r;
  return `<svg viewBox="0 0 200 200" class="donut">
    <circle cx="100" cy="100" r="${r}" class="ring-bg"/>
    <circle cx="100" cy="100" r="${r}" class="ring" style="stroke-dasharray:${C * frac} ${C}"/>
    <text x="100" y="110" class="big-txt">${Math.round(frac * 100)}%</text></svg>`;
}
function wykresLiniowy(vals){
  if (vals.length < 2) return `<p class="muted">Za mało danych do wykresu. Rozwiąż więcej zadań.</p>`;
  const W = 640, H = 240, P = 34;
  const max = Math.max(1, ...vals), n = vals.length;
  const pts = vals.map((v, i) => [P + i * (W - 2 * P) / (n - 1), H - P - (H - 2 * P) * v / max]);
  const linia = pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" class="chart"><polyline points="${linia}" class="linia"/>` +
    pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="4" class="kropka"/>`).join("") + `</svg>`;
}
function renderStatystyki(){
  const h = dane.historia;
  const ile = h.length, dobre = h.filter(x => x.dobra).length, zle = ile - dobre;
  const procent = ile ? Math.round(dobre / ile * 100) : 0;
  const dniAktywne = new Set(h.map(x => x.dzien)).size;

  const dni = [];
  for (let i = 13; i >= 0; i--){ const d = new Date(); d.setDate(d.getDate() - i); dni.push(klucz(d)); }
  const etykiety = dni.map(k => k.slice(8) + "." + k.slice(5, 7));
  const perDzien = dni.map(k => h.filter(x => x.dzien === k).length);

  const przedm = [...new Set(h.map(x => x.przedmiot))];
  const wgPrzed = przedm.map(p => {
    const w = h.filter(x => x.przedmiot === p);
    const ok = w.filter(x => x.dobra).length;

  const wiersze = wgPrzed.length
    ? wgPrzed.map(x => `<div class="hrow"><span>${esc(x.p)} (${x.ile})</span><div class="bar" style="--w:${x.proc}%"><i></i></div><b>${x.proc}%</b></div>`).join("")
    : `<p class="muted">Brak danych.</p>`;

  const punktyNarast = h.slice().reverse().reduce((acc, x) => { acc.push((acc[acc.length - 1] || 0) + x.pkt); return acc; }, []);

  const postepKursow = [...SYSTEM, ...dane.kursy].map(k => `<div class="hrow"><span>${esc(k.temat)}</span>
    <div class="bar" style="--w:${proc(k)}%"><i></i></div><b>${proc(k)}%</b></div>`).join("");

  V(navHTML() + `<h2>Statystyki</h2>
    <div class="stat-grid">
      <div class="card stat"><span class="muted">Odpowiedzi</span><b>${ile}</b></div>
      <div class="card stat"><span class="muted">Poprawnych</span><b>${procent}%</b></div>
      <div class="card stat"><span class="muted">Punkty</span><b>${dane.punkty}</b></div>
      <div class="card stat"><span class="muted">Najdłuższa seria</span><b>${dane.maxSeria}</b></div>
      <div class="card stat"><span class="muted">Dni aktywnych</span><b>${dniAktywne}</b></div>
      <div class="card stat"><span class="muted">Kursy i zestawy</span><b>${dane.kursy.length + SYSTEM.length}</b></div>
    </div>
    <div class="charts">
      <div class="card"><h3>Odpowiedzi z ostatnich 14 dni</h3>${wykresSlupkowy(etykiety, perDzien)}</div>
      <div class="card"><h3>Poprawne i błędne</h3>${wykresKolowy(dobre, zle)}
        <p class="muted" style="text-align:center">Poprawne: ${dobre} · błędne: ${zle}</p></div>
      <div class="card"><h3>Skuteczność według przedmiotu</h3>${wiersze}</div>
      <div class="card"><h3>Punkty w czasie</h3>${wykresLiniowy(punktyNarast)}</div>
      <div class="card" style="grid-column:1/-1"><h3>Postęp w kursach</h3>${postepKursow}</div>
    </div>`);
}

// ===================== KALKULATOR =====================
// Liczby zapisuje dokładnie jako ułamki (np. 3/4, 1 3/4), a funkcje liczy dziesiętnie.
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
function R(n, d = 1){
  if (d === 0) throw new Error("dzielenie przez zero");
  if (d < 0){ n = -n; d = -d; }
  const g = gcd(n, d) || 1;
  return {r: true, n: n / g, d: d / g};
}
function F(v){ return {r: false, v}; }
const val = x => x.r ? x.n / x.d : x.v;
function add(a, b){ return a.r && b.r ? R(a.n * b.d + b.n * a.d, a.d * b.d) : F(val(a) + val(b)); }
function sub(a, b){ return a.r && b.r ? R(a.n * b.d - b.n * a.d, a.d * b.d) : F(val(a) - val(b)); }
function mul(a, b){ return a.r && b.r ? R(a.n * b.n, a.d * b.d) : F(val(a) * val(b)); }
function div(a, b){
  if (val(b) === 0) throw new Error("dzielenie przez zero");
  return a.r && b.r ? R(a.n * b.d, a.d * b.n) : F(val(a) / val(b));
}
function neg(a){ return a.r ? R(-a.n, a.d) : F(-a.v); }
function pow(a, b){
  if (a.r && b.r && b.d === 1){
    const k = b.n;
    if (k === 0) return R(1);
    if (a.n === 0 && k < 0) throw new Error("dzielenie przez zero");
    const n = Math.abs(k) === k ? a.n ** k : a.d ** (-k);
    const d = Math.abs(k) === k ? a.d ** k : a.n ** (-k);
    if (Number.isSafeInteger(n) && Number.isSafeInteger(d)) return R(n, d);
  }
  return F(Math.pow(val(a), val(b)));
}
function fn(nm, a){
  const x = val(a);
  if (nm === "abs") return a.r ? R(Math.abs(a.n), a.d) : F(Math.abs(a.v));
  if (nm === "sqrt"){
    if (x < 0) throw new Error("pierwiastek z liczby ujemnej");
    if (a.r && Number.isInteger(Math.sqrt(a.n)) && Number.isInteger(Math.sqrt(a.d))) return R(Math.sqrt(a.n), Math.sqrt(a.d));
    return F(Math.sqrt(x));
  }
  if (nm === "sin") return F(Math.sin(x * Math.PI / 180));
  if (nm === "cos") return F(Math.cos(x * Math.PI / 180));
  if (nm === "tan") return F(Math.tan(x * Math.PI / 180));
  if (nm === "ln"){ if (x <= 0) throw new Error("logarytm z liczby ≤ 0"); return F(Math.log(x)); }
  if (nm === "log"){ if (x <= 0) throw new Error("logarytm z liczby ≤ 0"); return F(Math.log10(x)); }
  throw new Error("nieznana funkcja " + nm);
}
function decR(calk, ulam){
  return ulam ? R(+(calk + ulam), 10 ** ulam.length) : R(+calk);
}
function tokeny(s){
  const T = s.replace(/,/g, ".");
  const out = []; let i = 0;
  while (i < T.length){
    const ch = T[i], r = T.slice(i);
    if (ch === " "){ i++; continue; }
    let m;
    if ((m = r.match(/^(\d+) (\d+)\/(\d+)/))){
      out.push({k: "num", v: R(+m[1] * +m[3] + +m[2], +m[3])});
      i += m[0].length; continue;
    }
    if ((m = r.match(/^(\d+)(?:\.(\d+))?(?:\/(\d+))?/))){
      let v = decR(m[1], m[2]);
      if (m[3] !== undefined) v = div(v, R(+m[3]));
      out.push({k: "num", v});
      i += m[0].length; continue;
    }
    if ((m = r.match(/^(sin|cos|tan|ln|log|sqrt|abs)/))){ out.push({k: "fn", v: m[1]}); i += m[1].length; continue; }
    if ((m = r.match(/^(pi|π)/))){ out.push({k: "num", v: F(Math.PI)}); i += m[1].length; continue; }
    if (ch === "e"){ out.push({k: "num", v: F(Math.E)}); i++; continue; }
    if (ch === "×" || ch === "*"){ out.push({k: "op", v: "*"}); i++; continue; }
    if (ch === "−" || ch === "-"){ out.push({k: "op", v: "-"}); i++; continue; }
    if (ch === "÷" || ch === "/"){ out.push({k: "op", v: "÷"}); i++; continue; }
    if ("+^()".includes(ch)){ out.push({k: "op", v: ch}); i++; continue; }
    throw new Error(`nieznany znak „${ch}”`);
  }
  return out;
}
function parsuj(tok){
  let p = 0;
  const peek = () => tok[p];
  const isOp = (v) => peek() && peek().k === "op" && (Array.isArray(v) ? v.includes(peek().v) : peek().v === v);
  function expr(){
    let a = term();
    while (isOp(["+", "-"])){ const o = tok[p++].v; const b = term(); a = o === "+" ? add(a, b) : sub(a, b); }
    return a;
  }
  function term(){
    let a = unary();
    while (isOp(["*", "÷"])){ const o = tok[p++].v; const b = unary(); a = o === "*" ? mul(a, b) : div(a, b); }
    return a;
  }
  function unary(){
    if (isOp("-")){ p++; return neg(unary()); }
    return power();
  }
  function power(){
    const a = prim();
    if (isOp("^")){ p++; const b = unary(); return pow(a, b); }
    return a;
  }
  function prim(){
    const t = tok[p++];
    if (!t) throw new Error("wyrażenie jest niepełne");
    if (t.k === "num") return t.v;
    if (t.k === "fn"){
      if (!isOp("(")) throw new Error("po funkcji potrzebny nawias");
      p++; const a = expr(); zamknij(); return fn(t.v, a);
    }
    if (t.k === "op" && t.v === "("){ const a = expr(); zamknij(); return a; }
    throw new Error("nieoczekiwany znak");
  }
  function zamknij(){
    if (!isOp(")")) throw new Error("brakuje nawiasu zamykającego");
    p++;
  }
  const wynik = expr();
  if (p < tok.length) throw new Error("nadmiar znaków w wyrażeniu");
  return wynik;
}
function fmt(v){
  if (!v.r){
    if (!isFinite(v.v)) throw new Error("wynik nieokreślony");
    return String(+v.v.toPrecision(10));
  }
  if (v.d === 1) return String(v.n);
  if (dane.ustawienia.mieszane && Math.abs(v.n) > v.d){
    const w = Math.trunc(v.n / v.d), r = Math.abs(v.n) % v.d;
    return `${w} ${r}/${v.d}`;
  }
  return `${v.n}/${v.d}`;
}
const KEYS_S = [["7","7"],["8","8"],["9","9"],["÷","÷"],["4","4"],["5","5"],["6","6"],["×","×"],
                ["1","1"],["2","2"],["3","3"],["−","−"],["0","0"],[".","."],["a/b","/"],["+","+"],
                ["(","("],[")",")"],["⌫","⌫"],["C","C"]];
const KEYS_N = [["sin","sin("],["cos","cos("],["tan","tan("],["ln","ln("],["log","log("],
                ["√","sqrt("],["π","π"],["e","e"],["x²","^2"],["^","^"],["|x|","abs("],["x⁻¹","^-1"]];
function kKeys(){ return dane.ustawienia.kalkTryb === "naukowy" ? [...KEYS_N, ...KEYS_S] : KEYS_S; }
function kKey(i){
  const k = kKeys()[i], inp = $("kIn");
  if (k[1] === "⌫") inp.value = inp.value.slice(0, -1);
  else if (k[1] === "C"){ inp.value = ""; $("kOut").innerHTML = ""; }
  else inp.value += k[1];
  inp.focus();
}
function kCalc(){
  const s = $("kIn").value.trim();
  if (!s) return;
  try {
    const v = parsuj(tokeny(s));
    const przyb = v.r && v.d !== 1 ? `<div class="muted">≈ ${+(v.n / v.d).toFixed(6)}</div>` : "";
    $("kOut").innerHTML = `<b>= ${esc(fmt(v))}</b>${przyb}`;
  } catch(e){
    $("kOut").innerHTML = `<span class="bad">Błąd: ${esc(e.message)}</span>`;
  }
}
function kalkPanel(){
  const naukowy = dane.ustawienia.kalkTryb === "naukowy";
  const przyciski = kKeys().map((k, i) => `<button class="btn kb" onclick="kKey(${i})">${esc(k[0])}</button>`).join("");
  return `<div id="kalkInner">
    <div class="row">
      <button class="btn small ${!naukowy ? "sel" : ""}" onclick="ustawKalkTryb('prosty')">Prosty</button>
      <button class="btn small ${naukowy ? "sel" : ""}" onclick="ustawKalkTryb('naukowy')">Naukowy</button>
      <span class="muted">Ułamki: 3/4, mieszane: 1 3/4. Funkcje liczą w stopniach.</span>
    </div>
    <input id="kIn" class="calc-disp" placeholder="np. 3/4 + 1/6" autocomplete="off"
      onkeydown="if(event.key==='Enter')kCalc()">
    <div id="kOut" class="calc-out"></div>
    <div class="calc-grid">${przyciski}</div>
    <button class="btn wide calc-eq" onclick="kCalc()">= Oblicz</button>
  </div>`;
}
function ustawKalkTryb(t){
  dane.ustawienia.kalkTryb = t;
  zapisz();
  const el = $("kalkInner");
  if (el){ el.outerHTML = kalkPanel(); $("kIn").focus(); }
  else renderKalkulator();
}
function renderKalkulator(){
  V(navHTML() + `<div class="card pop"><h2>Kalkulator</h2>${kalkPanel()}</div>`);
  $("kIn").focus();
}

// ===================== HELP =====================
const PROMPT_AI = `Jesteś nauczycielem przygotowującym zadania do aplikacji "Trening". Do wiadomości dołączam zdjęcia zadań z przedmiotu: [WPISZ PRZEDMIOT].

Zrób dla KAŻDEGO zadania ze zdjęć:
1. Dokładnie odczytaj treść, łącznie z danymi, tabelami i wzorami.
2. Rozwiąż zadanie.
3. Zwróć WYŁĄCZNIE tablicę JSON, bez żadnego tekstu przed i po, bez oznaczeń kodu markdown.

Format każdego elementu:
{"tresc": "pełna treść zadania", "odpowiedz": "krótka poprawna odpowiedź", "podpowiedz": "jedno zdanie naprowadzające, bez zdradzania wyniku", "wyjasnienie": "rozwiązanie krok po kroku po polsku"}

Zasady:
- "odpowiedz" ma być krótka: liczba, litera albo jedno słowo. Jeśli dopuszczasz kilka form, oddziel je znakiem | (np. "1/2|0,5").
- Podpunkty (a, b, c) zapisz jako osobne elementy tablicy. W treści powtórz polecenie i potrzebne dane.
- Wzory zapisuj zwykłym tekstem, np. x^2, sqrt(x), 3/4.
- Nie używaj cudzysłowów w środku tekstów (używaj „ ” albo pojedynczych apostrofów).
- Jeśli czegoś nie widać na zdjęciu, napisz to w "wyjasnienie" zamiast zgadywać.
- Każdy element musi mieć pola "tresc" i "odpowiedz".`;

function renderHelp(){
  V(navHTML() + `<div class="card pop"><h2>Help: jak przygotować zadania z załączników</h2>
    <ol style="line-height:1.8">
      <li>Zrób zdjęcia zadań (ostre, dobrze oświetlone, każde zadanie dobrze widoczne).</li>
      <li>Otwórz AI (np. Claude), wklej poniższy prompt, zmień przedmiot i dołącz zdjęcia.</li>
      <li>Skopiuj odpowiedź AI (sama tablica JSON, zaczyna się od [).</li>
      <li>W aplikacji wejdź w <b>Kursy → Nowy kurs → Dodaj treść</b>, usuń przykład i wklej odpowiedź AI, potem kliknij <b>Zapisz zadania</b>.</li>
    </ol>
    <label>Prompt do skopiowania</label>
    <textarea class="prompt-box" id="promptBox" readonly>${esc(PROMPT_AI)}</textarea>
    <div class="row"><button class="btn" onclick="kopiujPrompt()">Kopiuj prompt</button></div>
  </div>
  <div class="card"><h3>Skróty i wskazówki</h3>
    <p>Enter w polu odpowiedzi sprawdza odpowiedź, a kolejny Enter przechodzi dalej.</p>
    <p>Podpowiedź kosztuje 5 pkt zamiast 10 za poprawną odpowiedź. Błędna odpowiedź zeruje serię.</p>
    <p>Po błędnej odpowiedzi kliknij <b>Spróbuj ponownie</b>. Punkty dostajesz tylko za pierwsze poprawne rozwiązanie zadania.</p>
    <p>Strzałka ← Wróć w nagłówku cofa Cię do poprzedniego ekranu, a Start prowadzi do listy kursów.</p>
    <p>Dane zapisują się w przeglądarce tego komputera. Zrób kopię zapasową w Ustawieniach, zanim wyczyścisz przeglądarkę.</p>
    <p>Zadania systemowe są gotowe do ćwiczenia i nie da się ich edytować ani usunąć.</p>
  </div>`);
}
function kopiujPrompt(){
  const box = $("promptBox");
  const awaryjnie = () => { box.select(); document.execCommand("copy"); toast("Prompt skopiowany"); };
  if (navigator.clipboard) navigator.clipboard.writeText(PROMPT_AI).then(() => toast("Prompt skopiowany"), awaryjnie);
  else awaryjnie();
}

// ===================== USTAWIENIA =====================
function renderUstawienia(){
  const u = dane.ustawienia;
  const motywy = MOTYWY.map(([k, n, sw]) => `
    <button class="btn ${u.motyw === k ? "sel" : ""}" onclick="ustawMotyw('${k}')">
      <span class="swatch" style="background:${sw}"></span>${n}</button>`).join("");
  const fonty = Object.keys(CZCIONKI).map(n => `
    <button class="btn ${u.czcionka === n ? "sel" : ""}" style="font-family:${CZCIONKI[n]}" onclick="ustawCzcionke('${n}')">${n}</button>`).join("");
  V(navHTML() + `
    <div class="card pop"><h2>Motyw kolorystyczny</h2>
      <div class="motyw-btns">${motywy}</div></div>
    <div class="card"><h2>Czcionka</h2>
      <div class="row">${fonty}</div></div>
    <div class="card"><h2>Ustawienia ogólne</h2>
      <label>Wielkość czcionki: <span id="rVal">${u.rozmiar}</span> px</label>
      <input type="range" min="14" max="24" value="${u.rozmiar}" oninput="$('rVal').textContent=this.value" onchange="ustawRozmiar(this.value)">
      <div class="row" style="margin-top:14px">
        <button class="btn ${u.anim ? "sel" : ""}" onclick="przelaczAnim()">Animacje: ${u.anim ? "włączone" : "wyłączone"}</button>
      </div></div>
    <div class="card"><h2>Kalkulator</h2>
      <div class="row">
        <button class="btn ${u.kalk ? "sel" : ""}" onclick="przelaczKalk()">Kalkulator: ${u.kalk ? "włączony" : "wyłączony"}</button>
        <button class="btn ${u.mieszane ? "sel" : ""}" onclick="przelaczMieszane()">Ułamki mieszane: ${u.mieszane ? "tak" : "nie"}</button>
      </div>
      <p class="muted">Gdy kalkulator jest włączony, pojawia się w menu oraz jako przycisk pod zadaniem, który pokazuje lub chowa panel.</p></div>
    <div class="card"><h2>Kopia zapasowa</h2>
      <p class="muted">Zapisz wszystkie kursy, wydarzenia, historię i osiągnięcia do pliku, albo wczytaj wcześniejszą kopię.</p>
      <div class="row">
        <button class="btn" onclick="eksport()">Eksportuj do pliku</button>
        <label class="btn ghost" style="margin:0;cursor:pointer">Importuj z pliku
          <input type="file" accept=".json" onchange="importuj(this)" style="display:none"></label>
        <button class="btn small danger" onclick="resetuj()">Resetuj wszystko</button>
      </div></div>`);
}
function ustawMotyw(k){ dane.ustawienia.motyw = k; zapisz(); applyUstawienia(); renderUstawienia(); }
function ustawCzcionke(n){ dane.ustawienia.czcionka = n; zapisz(); applyUstawienia(); renderUstawienia(); }
function ustawRozmiar(v){ dane.ustawienia.rozmiar = +v; zapisz(); applyUstawienia(); }
function przelaczAnim(){ dane.ustawienia.anim = !dane.ustawienia.anim; zapisz(); applyUstawienia(); renderUstawienia(); }
function przelaczKalk(){
  dane.ustawienia.kalk = !dane.ustawienia.kalk;
  zapisz();
  if (!dane.ustawienia.kalk && biezacy.w === "kalkulator") start();
  else renderUstawienia();
}
function przelaczMieszane(){ dane.ustawienia.mieszane = !dane.ustawienia.mieszane; zapisz(); renderUstawienia(); }

function eksport(){
  const blob = new Blob([JSON.stringify(dane, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "trening-kopia.json";
  a.click();
}
function importuj(input){
  const plik = input.files[0];
  if (!plik) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const nowe = JSON.parse(r.result);
      if (!Array.isArray(nowe.kursy)) throw new Error("brak listy kursów");
      const d = domyslne();
      dane = {...d, ...nowe, ustawienia: {...d.ustawienia, ...(nowe.ustawienia || {})}, stat: {...d.stat, ...(nowe.stat || {})}, osiagniete: nowe.osiagniete || {}};
      zapisz();
      applyUstawienia();
      toast("Kopia wczytana");
      start();
    } catch(e){ alert("Nie udało się wczytać pliku: " + e.message); }
  };
  r.readAsText(plik);
}
function resetuj(){
  if (!confirm("Na pewno skasować wszystkie kursy, wydarzenia, historię i osiągnięcia?")) return;
  dane = domyslne();
  zapisz();
  applyUstawienia();
  start();
}

// ===================== START =====================
applyUstawienia();
odswiezPasek();
zapisz();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
